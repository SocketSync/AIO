<!DOCTYPE html>
<html class="h-full bg-surface-container-low" lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <title>FinWise - Student Registration</title>
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#00236f",
            "primary-container": "#1e3a8a",
            "secondary": "#006c49",
            "growth-mint-subtle": "#D1FAE5",
            "surface": "#faf8ff",
            "surface-container-low": "#f4f3fa",
            "surface-container-high": "#e9e7ef",
            "border-neutral": "#E2E8F0",
            "text-primary": "#0F172A",
            "text-muted": "#64748B"
          }
        }
      }
    };
  </script>
</head>
<body class="bg-slate-100 flex flex-col items-center min-h-screen text-text-primary antialiased">
  <div class="w-full max-w-md bg-surface min-h-screen flex flex-col shadow-2xl relative border-x border-border-neutral">
    <!-- Header -->
    <header class="sticky top-0 w-full z-40 bg-surface/90 backdrop-blur-xl border-b border-border-neutral">
      <div class="h-14 px-4 flex items-center justify-between">
        <button onclick="location.href='login.html'" class="min-w-[40px] min-h-[40px] -ml-1 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors" type="button">
          <span class="material-symbols-outlined text-[24px]">arrow_back</span>
        </button>
        <h1 class="font-bold text-lg text-text-primary tracking-tight text-center truncate px-2 flex-1">Student Sign Up</h1>
        <div class="w-8 h-8"></div>
      </div>
    </header>

    <main class="flex-1 flex flex-col w-full px-4 pt-4 pb-6">
      <div class="mb-4">
        <h2 class="text-2xl font-bold tracking-tight">Create your account</h2>
        <p class="text-sm text-text-muted mt-1">Join FinWise Campus Banking to track semester allowance and meal budgets.</p>
      </div>

      <form class="flex flex-col gap-3.5" onsubmit="event.preventDefault(); handleSignUp();">
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-text-muted">Full Name *</label>
          <input id="signup-name" class="w-full bg-white px-3 py-2.5 rounded-lg border border-border-neutral text-sm outline-none focus:border-primary" required placeholder="Enter your full name">
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-text-muted">Email Address *</label>
          <input class="w-full bg-white px-3 py-2.5 rounded-lg border border-border-neutral text-sm outline-none focus:border-primary" type="email" required placeholder="Enter your email">
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-text-muted">Matric Number (Optional)</label>
          <input class="w-full bg-white px-3 py-2.5 rounded-lg border border-border-neutral text-sm outline-none focus:border-primary" placeholder="Enter your matric number">
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-text-muted">Password *</label>
          <input class="w-full bg-white px-3 py-2.5 rounded-lg border border-border-neutral text-sm outline-none focus:border-primary" id="signup-password" type="password" required minlength="8" maxlength="128" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,128}" title="Use at least 8 characters with uppercase, lowercase, and a number." placeholder="8+ characters: uppercase, lowercase & number">
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-text-muted">Confirm Password *</label>
          <input class="w-full bg-white px-3 py-2.5 rounded-lg border border-border-neutral text-sm outline-none focus:border-primary" id="signup-confirm-password" type="password" required placeholder="Repeat your password">
        </div>

        <button class="w-full min-h-[46px] bg-primary text-white rounded-lg text-sm font-bold flex items-center justify-center gap-2 shadow-md hover:bg-primary-container active:scale-[0.99] transition-all mt-2" type="submit">
          <span>Create Account &amp; Send OTP</span>
          <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
        </button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-sm text-text-muted">
          Already have an account? 
          <a class="text-primary font-bold hover:underline ml-1" href="login.html">Log In</a>
        </p>
      </div>
    </main>
  </div>

  <script>
    function handleSignUp() {
      const password = document.getElementById('signup-password').value;
      const confirmPassword = document.getElementById('signup-confirm-password').value;
      if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return;
      }

      // Save the user's name to localStorage for welcome greeting
      const nameInput = document.getElementById('signup-name');
      if (nameInput && nameInput.value.trim()) {
        localStorage.setItem('finwise_user_name', nameInput.value.trim());
      }

      alert("Registration successful! A 6-digit verification code has been dispatched to your email.");
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
