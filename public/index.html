<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <title>FinWise - Connecting with Google...</title>
  <link rel="icon" type="image/jpeg" href="FinwiseBigLogo.jpeg">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client for OAuth Code & Token Exchange -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-sm w-full bg-slate-800/80 border border-slate-700/60 rounded-2xl p-6 shadow-2xl flex flex-col items-center text-center">
    
    <!-- Animated Logo -->
    <div class="relative w-16 h-16 mb-4 flex items-center justify-center">
      <div class="absolute inset-0 rounded-2xl bg-emerald-500/20 animate-ping"></div>
      <img src="FinwiseBigLogo.jpeg" alt="FinWise Logo" class="w-16 h-16 rounded-2xl object-contain shadow-xl border-2 border-emerald-400 bg-white p-1">
    </div>

    <h1 class="text-lg font-bold tracking-tight text-white mb-1" id="status-title">Authenticating with Google</h1>
    <p class="text-xs text-slate-400 mb-6 leading-relaxed" id="status-desc">Verifying your Google credentials and synchronizing with Supabase...</p>

    <!-- Spinner -->
    <div class="w-8 h-8 border-3 border-emerald-400 border-t-transparent rounded-full animate-spin mb-4" id="spinner"></div>

    <div class="text-[11px] text-slate-500 flex items-center gap-1.5" id="status-footer">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span>FinWise AI Intelligence • Supabase Cloud</span>
    </div>

    <!-- Manual fallback button if needed -->
    <div id="manual-action" class="hidden mt-4 pt-4 border-t border-slate-700/60 w-full">
      <a href="dashboard.html" class="block w-full py-2.5 px-4 bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-bold rounded-xl text-xs transition-colors mb-2">
        Continue to Dashboard
      </a>
      <a href="login.html" class="block text-[11px] text-slate-400 hover:text-white transition-colors">
        Back to Login
      </a>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://vcxxsffdsznmqtpghrss.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZjeHhzZmZkc3pubXF0cGdocnNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyMjgwOTMsImV4cCI6MjEwOTgwNDA5M30.bxxoU1PgcSeOMkss5kx71dI3P67eTL9bk9TzaJC_1VM";
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    function formatNameFromEmail(email) {
      if (!email) return "Google User";
      const prefix = email.split('@')[0];
      return prefix
        .replace(/[._-]/g, ' ')
        .split(' ')
        .filter(w => w.length > 0)
        .map(w => w[0].toUpperCase() + w.slice(1))
        .join(' ');
    }

    function saveUserSession(user) {
      const meta = user.user_metadata || {};
      const email = user.email || "";
      const name = meta.full_name || meta.name || formatNameFromEmail(email);
      const avatar = meta.avatar_url || meta.picture || "";
      const initial = (name[0] || 'G').toUpperCase();

      localStorage.setItem('finwise_user_name', name);
      localStorage.setItem('finwise_user_email', email);
      localStorage.setItem('finwise_user_id', user.id);
      localStorage.setItem('finwise_auth_provider', 'google');
      localStorage.setItem('finwise_user_avatar', avatar || initial);
      localStorage.setItem('finwise_session', JSON.stringify({
        id: user.id,
        name: name,
        email: email,
        avatar: avatar,
        provider: 'google',
        authenticatedAt: new Date().toISOString()
      }));

      // Sync profile table in Supabase
      if (supabaseClient) {
        supabaseClient.from('profiles').upsert({
          id: user.id,
          email: email,
          display_name: name,
          avatar_url: avatar || null,
          currency: 'RM',
          monthly_budget: 2500.00
        }).catch(() => {});
      }
    }

    async function handleAuthRedirect() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const errorDesc = urlParams.get('error_description') || urlParams.get('error');

      if (errorDesc) {
        document.getElementById('status-title').textContent = 'Sign-in Notice';
        document.getElementById('status-desc').textContent = decodeURIComponent(errorDesc);
        document.getElementById('spinner').classList.add('hidden');
        document.getElementById('manual-action').classList.remove('hidden');
        return;
      }

      // Case 1: OAuth Code received in query parameter (?code=...)
      if (code && supabaseClient) {
        document.getElementById('status-title').textContent = 'Exchanging Google Code...';
        document.getElementById('status-desc').textContent = 'Connecting with Supabase authentication engine...';

        try {
          const { data, error } = await supabaseClient.auth.exchangeCodeForSession(code);

          if (!error && data && data.session && data.session.user) {
            saveUserSession(data.session.user);
            document.getElementById('status-title').textContent = 'Authenticated!';
            document.getElementById('status-desc').textContent = 'Welcome, ' + (localStorage.getItem('finwise_user_name') || 'Google User') + '! Redirecting to your dashboard...';
            setTimeout(() => {
              window.location.replace('dashboard.html');
            }, 500);
            return;
          } else if (error) {
            console.warn("Code exchange notice:", error.message);
          }
        } catch (e) {
          console.warn("Code exchange error:", e);
        }
      }

      // Case 2: Check existing active user session
      const existing = localStorage.getItem('finwise_session');
      const activeEmail = localStorage.getItem('finwise_user_email');
      if (existing && activeEmail) {
        window.location.replace('dashboard.html');
        return;
      }

      // Case 3: Default route to login (Clean slate for user to pick account)
      window.location.replace('login.html');
    }

    handleAuthRedirect();
  </script>
</body>
</html>
